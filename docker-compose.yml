services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crudl
      POSTGRES_USER: crudl
      POSTGRES_PASSWORD: crudl
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crudl -d crudl"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgres://crudl:crudl@db:5432/crudl
      PORT: 3000
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
